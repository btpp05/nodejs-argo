name: VPS8 Checkin

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run checkin script
        env:
          VPS8_COOKIES: ${{ secrets.VPS8_COOKIES }}
        run: python vps8_checkin.py
